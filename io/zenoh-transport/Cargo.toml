[package]
authors = { workspace = true }
categories = { workspace = true }
description = "Internal crate for zenoh."
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
license-file = { workspace = true }
name = "bombay-zenoh-transport"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
test = []
transport_tls = ["zenoh-link/transport_tls"]
unstable = ["zenoh-config/unstable", "zenoh-protocol/unstable"]

[dependencies]
async-trait = { workspace = true }
crossbeam-utils = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
lazy_static = { workspace = true }
lz4_flex = { workspace = true }
rand = { workspace = true, features = ["default"] }
ringbuffer-spsc = { workspace = true }
serde = { workspace = true, features = ["default"] }
sha3 = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
zenoh-buffers = { workspace = true }
zenoh-codec = { workspace = true }
zenoh-config = { workspace = true }
zenoh-core = { workspace = true }
zenoh-crypto = { workspace = true }
zenoh-link = { workspace = true }
zenoh-link-commons = { workspace = true }
zenoh-protocol = { workspace = true }
zenoh-result = { workspace = true }
zenoh-runtime = { workspace = true }
zenoh-sync = { workspace = true }
zenoh-task = { workspace = true }
zenoh-util = { workspace = true }

[dev-dependencies]
zenoh-protocol = { workspace = true, features = ["test"] }
zenoh-test = { workspace = true }
zenoh-util = { workspace = true }

[lib]
name = "zenoh_transport"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("auth_pubkey", "auth_usrpwd", "shared-memory", "stats", "transport_auth", "transport_compression", "transport_multilink", "transport_quic", "transport_quic_datagram", "transport_serial", "transport_tcp", "transport_udp", "transport_unixpipe", "transport_unixsock-stream", "transport_vsock", "transport_ws", "uring"))',
] }

[package.metadata.bombay]
upstream-repository = "https://github.com/eclipse-zenoh/zenoh"
upstream-revision = "1211779c3647f5a96713dade452c546a07823580"
controlled-repository = "https://github.com/devrandom-labs/bombay-zenoh"
supported-profile = "tls-only"
