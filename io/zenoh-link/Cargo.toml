[package]
authors = { workspace = true }
categories = { workspace = true }
description = "Internal crate for zenoh."
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
license-file = { workspace = true }
name = "bombay-zenoh-link"
repository = { workspace = true }
rust-version = "1.88.0"
version = "1.10.2"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
transport_tls = ["zenoh-link-tls"]

[dependencies]
zenoh-config = { workspace = true }
zenoh-link-commons = { workspace = true }
zenoh-link-tls = { workspace = true, optional = true }
zenoh-protocol = { workspace = true }
zenoh-result = { workspace = true }

[lib]
name = "zenoh_link"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("transport_quic", "transport_quic_datagram", "transport_serial", "transport_tcp", "transport_udp", "transport_unixpipe", "transport_unixsock-stream", "transport_vsock", "transport_ws", "uring"))',
] }

[package.metadata.bombay]
upstream-repository = "https://github.com/eclipse-zenoh/zenoh"
upstream-revision = "1211779c3647f5a96713dade452c546a07823580"
controlled-repository = "https://github.com/devrandom-labs/bombay-zenoh"
supported-profile = "tls-only"
