[package]
authors = { workspace = true }
categories = { workspace = true }
description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
license-file = { workspace = true }
name = "bombay-zenoh"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
version = "1.10.3"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["transport_tls"]
internal = ["zenoh-config/internal", "zenoh-keyexpr/internal", "zenoh-protocol/internal"]
internal_config = []
test = ["zenoh-transport/test"]
transport_tls = ["zenoh-transport/transport_tls"]
unstable = ["zenoh-config/unstable", "zenoh-keyexpr/unstable", "zenoh-protocol/unstable", "zenoh-transport/unstable"]

[dependencies]
ahash = { workspace = true, default-features = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
const_format = { workspace = true }
flate2 = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
git-version = { workspace = true }
itertools = { workspace = true }
json5 = { workspace = true }
lazy_static = { workspace = true }
nonempty-collections = { workspace = true }
once_cell = { workspace = true }
petgraph = { workspace = true }
phf = { workspace = true }
rand = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["default"] }
serde_json = { workspace = true }
socket2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uhlc = { workspace = true, features = ["default"] }
vec_map = { workspace = true }
zenoh-buffers = { workspace = true, features = ["std"] }
zenoh-codec = { workspace = true }
zenoh-collections = { workspace = true, features = ["std"] }
zenoh-config = { workspace = true }
zenoh-core = { workspace = true }
zenoh-keyexpr = { workspace = true, features = ["internal"] }
zenoh-link = { workspace = true }
zenoh-link-commons = { workspace = true }
zenoh-macros = { workspace = true }
zenoh-plugin-trait = { workspace = true }
zenoh-protocol = { workspace = true, features = ["std"] }
zenoh-result = { workspace = true }
zenoh-runtime = { workspace = true }
zenoh-sync = { workspace = true }
zenoh-task = { workspace = true }
zenoh-transport = { workspace = true }
zenoh-util = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
predicates = { workspace = true }
regex = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true }
tracing-capture = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tunnel = { workspace = true }
zenoh-protocol = { workspace = true, features = ["test"] }
zenoh-test = { workspace = true, features = ["internal", "unstable"] }

[build-dependencies]
rustc_version = { workspace = true }

[lib]
name = "zenoh"

[package.metadata.docs.rs]
features = ["transport_tls"]
no-default-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(nolocal_thread_not_available)',
  'cfg(feature, values("auth_pubkey", "auth_usrpwd", "plugins", "runtime_plugins", "shared-memory", "stats", "tracing-instrument", "transport_compression", "transport_multilink", "transport_quic", "transport_quic_datagram", "transport_serial", "transport_tcp", "transport_udp", "transport_unixpipe", "transport_unixsock-stream", "transport_vsock", "transport_ws", "uring"))',
] }
# This will be enabled by default in Edition 2024
unsafe_op_in_unsafe_fn = "warn"

[package.metadata.bombay]
upstream-repository = "https://github.com/eclipse-zenoh/zenoh"
upstream-revision = "1211779c3647f5a96713dade452c546a07823580"
controlled-repository = "https://github.com/devrandom-labs/bombay-zenoh"
supported-profile = "tls-only"
