[package]
authors = { workspace = true }
categories = { workspace = true }
description = "Internal crate for zenoh."
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
license-file = { workspace = true }
name = "bombay-zenoh-config"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[features]
internal = []
unstable = ["dep:toml", "zenoh-protocol/unstable"]

[dependencies]
json5 = { workspace = true }
nonempty-collections = { workspace = true }
num_cpus = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["default"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true }
uhlc = { workspace = true }
validated_struct = { workspace = true, features = ["json5", "json_get"] }
zenoh-core = { workspace = true }
zenoh-keyexpr = { workspace = true }
zenoh-macros = { workspace = true }
zenoh-protocol = { workspace = true }
zenoh-result = { workspace = true }
zenoh-util = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["tracing"]

[lib]
name = "zenoh_config"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("transport_tcp"))',
] }

[package.metadata.bombay]
upstream-repository = "https://github.com/eclipse-zenoh/zenoh"
upstream-revision = "1211779c3647f5a96713dade452c546a07823580"
controlled-repository = "https://github.com/devrandom-labs/bombay-zenoh"
supported-profile = "tls-only"
