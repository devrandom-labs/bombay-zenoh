name: Controlled dependency verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: controlled-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-tls:
    name: Controlled TLS dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Verify selected owning contracts and release archives
        run: BOMBAY_YAML_SOURCE_CORPUS="$PWD/DEFAULT_CONFIG.json5" nix develop -c bash ci/verify-release.sh
      - name: Verify the exact supported compiler floor
        run: CARGO_TARGET_DIR="$PWD/target/compiler-floor" nix develop .#compiler-floor -c bash ci/compiler-floor.sh
      - name: Verify actual configuration syntax owner under Miri
        run: nix develop .#miri -c cargo miri test --locked -p bombay-validated-struct-macros --test structure
      - name: Preserve verified release archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-package-archives-${{ github.sha }}
          path: |
            target/package/bombay-*.crate
            target/package/tmp-crate/bombay-*.crate
            target/package/tmp-crate/published-dependencies.json
            target/package/audited-cohort.json
            target/package/packaged-query-*
            target/package/packaged-config-*
            target/package/compiler-floor-evidence.*/**
          if-no-files-found: error
          retention-days: 14
