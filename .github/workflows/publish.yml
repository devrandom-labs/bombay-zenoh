name: Manual controlled dependency release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Verified source commit (current main; retained e8248182 for resume)
        required: true
        type: string
      operation:
        description: Verify packaging or publish the reviewed dependency successor
        required: true
        type: choice
        default: verify
        options: [verify, publish, resume]

      release_kind:
        description: Exact reviewed successor closure (resume retains its original cohort)
        required: true
        type: choice
        default: tls-security-successor
        options: [tls-security-successor, configuration-successor, zenoh-successor]

permissions:
  contents: read
  checks: read
  actions: read

env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: controlled-dependency-release
  cancel-in-progress: false

jobs:
  release:
    name: Manual verified release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Release the exact verified source
        run: |
          if [[ "${{ inputs.operation }}" == resume ]]; then
            nix develop -c bash ci/resume-release.sh
          else
            nix develop -c bash ci/publish-release.sh
          fi
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          GH_TOKEN: ${{ github.token }}
          BOMBAY_RELEASE_TOKEN: ${{ secrets.CARGO_REGISTRY_SECRET }}
      - name: Retain exact package artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controlled-release-${{ github.sha }}
          path: |
            target/package/tmp-crate/bombay-*.crate
            target/package/audited-cohort.json
            target/package/registry-receipts.json
            target/package/tmp-crate/published-dependencies.json
            target/retained-source/target/package/tmp-crate/bombay-*.crate
            target/retained-source/target/package/audited-cohort.json
            target/retained-source/target/package/remaining-cohort.json
            target/retained-source/target/package/registry-receipts.json
            target/first-release/run.json
          if-no-files-found: ignore
          retention-days: 14
