[package]
name = "bombay-zenoh-configuration-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[features]
maintainer = ["zenoh/internal"]
maintainer_macros = ["maintainer", "zenoh/unstable"]

[dependencies]
validated_struct = { package = "bombay-validated-struct", path = "../../dependencies/validated-struct", features = ["json_get", "json5"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zenoh_config = { package = "bombay-zenoh-config", path = "../../commons/zenoh-config", version = "=1.10.1" }
zenoh = { package = "bombay-zenoh", path = "../../zenoh", version = "=1.10.6" }
zenoh_link = { package = "bombay-zenoh-link", path = "../../io/zenoh-link", version = "=1.10.1", features = ["transport_tls"] }

[workspace]
